<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIAKAD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen">
    <div class="bg-slate-800/80 backdrop-blur border border-slate-700/80 p-8 rounded-2xl shadow-2xl w-full max-w-md space-y-6">
        
        <div class="text-center space-y-3">
            <img src="{{ url_for('static', filename='Logo UCA.png') }}" alt="Logo Universitas Cendekia Abditama" class="mx-auto h-16 w-auto object-contain">
            <div>
                <h1 class="text-xl font-bold tracking-wide text-white">SIAKAD</h1>
                <p class="text-xs text-indigo-400 font-medium">Universitas Cendekia Abditama</p>
            </div>
        </div>

        {% if pesan %}
        <div class="p-3 bg-rose-500/10 border border-rose-500/30 text-rose-300 rounded-xl text-sm text-center">
            {{ pesan }}
        </div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Username</label>
                <input type="text" name="username" placeholder="Masukkan username..." required 
                       class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Password</label>
                <input type="password" name="password" placeholder="Masukkan password..." required 
                       class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/20">
                Masuk
            </button>
        </form>

        <div class="text-center text-xs text-slate-400 pt-2">
            Belum punya akun? <a href="{{ url_for('register') }}" class="text-indigo-400 hover:underline font-semibold">Daftar di sini</a>
        </div>
    </div>
</body>
</html>
