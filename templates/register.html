<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Register - SIAKAD</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen">
    <div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl shadow-xl w-full max-w-md space-y-6">
        <div class="text-center">
            <h1 class="text-2xl font-bold">Daftar Akun User</h1>
            <p class="text-xs text-slate-400">Akses lihat dan cari data akademik</p>
        </div>
        {% if pesan %}
        <div class="p-3 bg-rose-500/10 border border-rose-500/30 text-rose-300 rounded-xl text-sm text-center">
            {{ pesan }}
        </div>
        {% endif %}
        <form action="{{ url_for('register') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2">Username</label>
                <input type="text" name="username" required class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-2">Password</label>
                <input type="password" name="password" required class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl transition">Daftar</button>
        </form>
        <div class="text-center text-xs text-slate-400">
            Sudah punya akun? <a href="{{ url_for('login') }}" class="text-indigo-400 hover:underline font-semibold">Login</a>
        </div>
    </div>
</body>
</html>
